[package]
name = "glacier-ui"
version = "0.89.0"
edition = "2024"
description = "Declarative UI engine for Rust: render UI from XML to iced, with hot-reload, data binding, components and .gss stylesheets."
license = "MIT OR Apache-2.0"
repository = "https://github.com/antoniofernandodj/glacier-ui"
readme = "README.md"
keywords = ["gui", "ui", "iced", "xml", "declarative"]
categories = ["gui"]

# Desliga a descoberta automática de `examples/`. Os 31 exemplos continuam no
# disco (e `tests/exemplos_gv.rs` segue conferindo os `.gv` deles, que é leitura
# de arquivo, não compilação) — o cargo só para de construí-los.
#
# O motivo é o custo: `cargo test` compila TODO exemplo, cada um linka o motor
# inteiro estaticamente (iced + wgpu + naga + Luau + codecs de imagem + resvg), e
# no perfil dev 86% do binário é debuginfo. Deu 31 x 506 MB = 15,2 GiB em
# `target/debug/examples`, quase 70% de um target de 22 GiB — e boa parte disso
# é o MESMO debuginfo das dependências repetido 31 vezes.
#
# Exemplo novo daqui em diante entra explicitamente, um bloco por exemplo:
#
#     [[example]]
#     name = "contador"
#     path = "examples/contador/main.rs"
#
# Para rodar um exemplo antigo sem declará-lo, o caminho é reativar a descoberta
# pontualmente: `cargo run --example contador` depois de comentar a linha abaixo.
autoexamples = false

[[example]]
name = "spinbox"
path = "examples/spinbox/main.rs"

[[example]]
name = "timepicker"
path = "examples/timepicker/main.rs"

[[example]]
name = "data_hora_luau"
path = "examples/data_hora_luau/main.rs"

[[example]]
name = "componentes_locais"
path = "examples/componentes_locais/main.rs"

[[example]]
name = "onda4"
path = "examples/onda4/main.rs"

[[example]]
name = "onda4_luau"
path = "examples/onda4_luau/main.rs"

[[example]]
name = "onda3"
path = "examples/onda3/main.rs"

[[example]]
name = "onda1"
path = "examples/onda1/main.rs"

[[example]]
name = "onda2"
path = "examples/onda2/main.rs"

[dependencies]
iced = { version = "0.14", features = ["image", "svg", "tokio", "advanced"] }
roxmltree = "0.21"
image = "0.25"
serde_json = "1.0"
regex = "1"
mlua = { version = "0.11.6", features = ["luau", "vendored", "serialize"] }
hyper = { version = "1.10.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1.3"
tokio = { version = "1.52.3", features = ["rt", "net", "io-util", "time", "fs"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["ring", "webpki-roots", "http1"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "std"] }
futures = "0.3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# Notificações nativas do SO (freedesktop/D-Bus no Linux/BSD via zbus puro-Rust,
# NSUserNotification no macOS, toast WinRT no Windows). Usado por `notify()` na
# camada Luau — ver Context::notify.
notify-rust = "4.18"

# Descompressão gzip das respostas HTTP do `fetch` (Content-Encoding: gzip) — ver
# net.rs. Backend puro-Rust (miniz_oxide, default), sem dependência de C.
flate2 = "1"

# Corpo binário em `fetch` (`body_base64`) e leitura de arquivo local em base64
# (`fetch("file://…", { response = "base64" })`). Necessário porque tanto o corpo
# da requisição quanto o `body` do FetchResult trafegam como texto (String) na
# fronteira Rust↔Lua; base64 mantém bytes arbitrários (ex.: um .zip) UTF-8-safe.
base64 = "0.22"

# Diálogo de arquivo/pasta NATIVO do SO (Open/OpenMultiple/Save/Directory) —
# ver src/file_dialog.rs e `open_file`/`open_files`/`save_file`/`pick_folder`
# na camada Luau. `AsyncFileDialog` devolve um future `Send`, encaixado em
# `iced::Task::perform` do mesmo jeito que `net::perform` já é.
rfd = "0.17"

# `zip_dir(origem, destino)` na camada Luau (ver src/luau/mod.rs) — compacta
# um diretório num .zip. Features default do crate ligam bzip2/lzma/zstd/
# aes/ppmd/xz que não usamos; `deflate-flate2` reaproveita o `flate2` que já
# é dependência direta deste projeto (gzip do `fetch`, ver `net.rs`).
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

# ── Bandeja (system tray) — opcional, atrás da feature `tray` ────────────────
# Só compila quando um app pede `.tray(...)` E habilita `features = ["tray"]`;
# assim quem não usa bandeja não arrasta GTK/tray-icon. No Linux a bandeja usa
# libappindicator+GTK, e a thread dedicada precisa do `gtk` para inicializar e
# rodar o loop GTK; no Windows, do `windows-sys` para o message-loop Win32. macOS
# não é suportado (exige a thread principal). Ver `src/tray.rs`.
[dependencies.tray-icon]
version = "0.24"
optional = true

[target.'cfg(target_os = "linux")'.dependencies.gtk]
version = "0.18"
optional = true

# Só para o `setlocale(LC_NUMERIC, "C")` que desfaz o efeito colateral global do
# `gtk::init()` (ver `src/tray.rs`). Preferido a declarar o `extern "C"` na mão
# porque `LC_NUMERIC` é um inteiro mágico que varia entre plataformas/libc.
[target.'cfg(target_os = "linux")'.dependencies.libc]
version = "0.2"
optional = true

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.59"
features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"]
optional = true

[features]
# Habilita o ícone de bandeja e o app que sobrevive à última janela. `dep:gtk` e
# `dep:windows-sys` são deps por-alvo: a ativação é no-op nos alvos onde não
# existem, então a feature é a mesma nas três plataformas.
tray = ["dep:tray-icon", "dep:gtk", "dep:windows-sys", "dep:libc"]

# ── Workspace ────────────────────────────────────────────────────────────────
# O motor (este pacote) e o `glacier` — a CLI que faz o bootstrap de um projeto
# novo e instala as extensões de VS Code. A CLI é um crate SEPARADO de propósito:
# ela não depende de `iced`/`mlua`, então `cargo install glacier-cli` compila em
# segundos em vez dos minutos que o motor leva.
[workspace]
members = ["crates/glacier-cli"]
