# A configuração deste app. Ela entra em /etc/nginx/conf.d/default.conf (ver o
# Dockerfile), que a imagem do nginx inclui dentro do http{} dela.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # O `app.js` e o `app_bg.wasm` estão gravados SÓ em `.gz` — o Dockerfile
  # comprime e joga o original fora. `gzip_static always` manda o `.gz` mesmo
  # sem `Accept-Encoding: gzip` no pedido, e `gunzip on` o descomprime na hora
  # para o cliente raro que não aceita gzip. É o que deixa a imagem com uma
  # fração do tamanho sem responder coisa quebrada para ninguém.
  gzip_static always;
  gunzip on;

  # O `index.html` fica sem comprimir de propósito: a diretiva `index` olha o
  # arquivo de verdade, e com só o `index.html.gz` no disco a raiz daria 404.

  # Os nomes dos artefatos são fixos (`app.js`, `app_bg.wasm`), então eles não
  # podem ser cacheados por tempo: depois de um deploy o navegador seguiria
  # rodando o `.wasm` anterior, sem aviso nenhum. É o mesmo problema que o
  # `Cache-Control: no-store` do `glacier serve wasm` evita em desenvolvimento.
  # `no-cache` não proíbe o cache, obriga a revalidar — a resposta seguinte é um
  # 304 curto, não o download inteiro.
  # Sem `try_files` aqui, e isso é a pegadinha desta configuração: o
  # `try_files` procura o arquivo EXATO no disco, e como o `app.js` só existe
  # como `app.js.gz`, ele responderia 404 sem nunca chegar ao `gzip_static`.
  # O tratamento estático padrão do nginx é que consulta o `.gz` — e um arquivo
  # que não existe em nenhuma das duas formas continua dando 404.
  location / {
    add_header Cache-Control "no-cache";
  }

  # `application/wasm` é o que importa nestas linhas: sem esse tipo, o
  # `WebAssembly.instantiateStreaming` do `app.js` falha e cai num caminho mais
  # lento, com aviso no console. O `mime.types` desta imagem já mapeia `.wasm`;
  # está escrito aqui porque é barato e porque a falha é silenciosa.
  location = /app_bg.wasm {
    types { }
    default_type application/wasm;
    add_header Cache-Control "no-cache";
  }

  # Para quem orquestra a imagem (compose, k8s, Cloud Run) ter o que checar.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
