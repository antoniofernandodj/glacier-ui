<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{titulo}}</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #11111b;
      }

      /* O iced troca o elemento de id "iced" pelo canvas da janela principal;
         o winit observa o tamanho CSS do canvas e redimensiona a superfície. */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="iced"></div>
    <!-- `app.js` e `app_bg.wasm` são gerados pelo `glacier serve wasm`
      (wasm-bindgen --out-name app), ao lado desta página. -->
    <script type="module">
      import init from "./app.js";
      init();
    </script>
  </body>
</html>
