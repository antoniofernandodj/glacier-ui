<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel</title>
<style>
  body { margin: 0; padding: 20px; background: #1e1e2e; color: #cdd6f4; font: 16px sans-serif; }
  h1 { font-size: 24px; margin: 0 0 14px; }
  .linha { display: flex; gap: 16px; margin-bottom: 14px; }
  input { width: 260px; padding: 6px; }
  button { padding: 8px; }
  .lista { width: 300px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .rotulo { font-size: 12px; color: #a6adc8; }
  .grafico { display: flex; flex-direction: column; gap: 8px; }
  canvas { width: 380px; height: 220px; }
</style>
</head>
<body>
<h1>Painel de serviços</h1>
<div class="linha">
  <input id="nome" placeholder="Nome do serviço">
  <button id="add">Adicionar</button>
</div>
<div class="linha">
  <div class="lista" id="lista"></div>
  <div class="grafico">
    <div class="rotulo">Requisições por hora (fetch)</div>
    <canvas id="g" width="380" height="220"></canvas>
    <div class="rotulo" id="status">carregando…</div>
  </div>
</div>
<script>
  const servicos = [{nome:"api",estado:"ok"},{nome:"banco",estado:"ok"},{nome:"fila",estado:"lento"}];
  const lista = document.getElementById("lista");
  function publicar() {
    lista.replaceChildren(...servicos.map(s => Object.assign(document.createElement("div"), {textContent: `${s.nome} — ${s.estado}`})));
  }
  document.getElementById("add").onclick = () => {
    const i = document.getElementById("nome");
    if (!i.value) return;
    servicos.push({nome: i.value, estado: "novo"});
    i.value = "";
    publicar();
  };
  publicar();
  fetch("../dados.json").then(r => r.json().then(d => {
    const c = document.getElementById("g").getContext("2d");
    const max = Math.max(...d.map(x => x.value));
    const cores = ["#89b4fa","#a6e3a1","#f9e2af","#f38ba8","#cba6f7","#94e2d5"];
    d.forEach((x, i) => {
      const h = x.value / max * 180, w = 380 / d.length;
      c.fillStyle = cores[i % cores.length];
      c.fillRect(i * w + 8, 200 - h, w - 16, h);
      c.fillStyle = "#a6adc8"; c.fillText(x.label, i * w + 12, 215);
    });
    document.getElementById("status").textContent = "ok (" + r.status + ")";
  })).catch(e => document.getElementById("status").textContent = "falhou: " + e);
</script>
</body>
</html>
