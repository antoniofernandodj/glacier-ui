<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel</title>
<style>
  body { margin: 0; padding: 20px; background: #1e1e2e; color: #cdd6f4; font: 16px sans-serif; }
  h1 { font-size: 24px; margin: 0 0 14px; }
  .linha { display: flex; gap: 16px; margin-bottom: 14px; }
  input { width: 260px; padding: 6px; }
  button { padding: 8px; }
  .lista { width: 300px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .rotulo { font-size: 12px; color: #a6adc8; }
  .grafico { display: flex; flex-direction: column; gap: 8px; }
  canvas { width: 380px; height: 220px; }
</style>
</head>
<body>
<h1 id="titulo">Painel de serviços</h1>
<div class="linha">
  <input id="nome" placeholder="Nome do serviço">
  <button id="add">Adicionar</button>
</div>
<div class="linha">
  <div class="lista" id="lista"></div>
  <div class="grafico">
    <div class="rotulo" id="grafico">Requisições por hora (fetch)</div>
    <canvas id="g" width="380" height="220"></canvas>
    <div class="rotulo" id="status">carregando…</div>
  </div>
</div>
<div class="linha">
  <button id="pt">Português</button>
  <button id="en">English</button>
</div>
<script>
  // As mesmas traduções de locales/*.json do painel Glacier — a tela tem de ser a mesma.
  const T = {
    "pt-BR": {titulo:"Painel de serviços", nome_servico:"Nome do serviço", adicionar:"Adicionar",
              grafico:"Requisições por hora (fetch)",
              estado:{ok:"ok", lento:"lento", novo:"novo"}, status:{carregando:"carregando…", ok:"ok", falhou:"falhou"}},
    "en":    {titulo:"Services dashboard", nome_servico:"Service name", adicionar:"Add",
              grafico:"Requests per hour (fetch)",
              estado:{ok:"ok", lento:"slow", novo:"new"}, status:{carregando:"loading…", ok:"ok", falhou:"failed"}},
  };
  let idioma = "pt-BR";
  let statusEstado = "carregando", statusSufixo = "";
  const servicos = [{nome:"api",estado:"ok"},{nome:"banco",estado:"ok"},{nome:"fila",estado:"lento"}];
  const lista = document.getElementById("lista");
  function publicar() {
    lista.replaceChildren(...servicos.map(s => Object.assign(document.createElement("div"), {textContent: `${s.nome} — ${T[idioma].estado[s.estado]}`})));
  }
  function traduzir() {
    const t = T[idioma];
    document.getElementById("titulo").textContent = t.titulo;
    document.getElementById("nome").placeholder = t.nome_servico;
    document.getElementById("add").textContent = t.adicionar;
    document.getElementById("grafico").textContent = t.grafico;
    document.getElementById("status").textContent = t.status[statusEstado] + statusSufixo;
    publicar();
  }
  document.getElementById("pt").onclick = () => { idioma = "pt-BR"; traduzir(); };
  document.getElementById("en").onclick = () => { idioma = "en"; traduzir(); };
  document.getElementById("add").onclick = () => {
    const i = document.getElementById("nome");
    if (!i.value) return;
    servicos.push({nome: i.value, estado: "novo"});
    i.value = "";
    publicar();
  };
  publicar();
  fetch("../dados.json").then(r => r.json().then(d => {
    const c = document.getElementById("g").getContext("2d");
    const max = Math.max(...d.map(x => x.value));
    const cores = ["#89b4fa","#a6e3a1","#f9e2af","#f38ba8","#cba6f7","#94e2d5"];
    d.forEach((x, i) => {
      const h = x.value / max * 180, w = 380 / d.length;
      c.fillStyle = cores[i % cores.length];
      c.fillRect(i * w + 8, 200 - h, w - 16, h);
      c.fillStyle = "#a6adc8"; c.fillText(x.label, i * w + 12, 215);
    });
    statusEstado = "ok"; statusSufixo = " (" + r.status + ")"; traduzir();
  })).catch(e => { statusEstado = "falhou"; statusSufixo = ": " + e; traduzir(); });
</script>
</body>
</html>
